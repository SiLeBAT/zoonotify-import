name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    # Needs the sibling zoonotify-cms checked out next to this repo to build its
    # Docker image. In the monorepo both packages are already present; for a
    # standalone checkout, fetch the CMS into ../zoonotify-cms first.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run docker-compose integration suite
        run: npm run test:integration
