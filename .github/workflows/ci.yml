name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    # The compose stack builds the CMS image from the sibling ../zoonotify-cms,
    # which the monorepo layout provides locally but a CI checkout does not.
    steps:
      - uses: actions/checkout@v4
      # actions/checkout refuses paths outside the workspace, so clone directly.
      # `develop` because CMS fixes the importer depends on land there first
      # (e.g. the is-import-token policy for Strapi 5's content-api-token).
      - name: Fetch the sibling zoonotify-cms
        run: git clone --depth 1 --branch develop https://github.com/SiLeBAT/zoonotify-cms.git ../zoonotify-cms
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run docker-compose integration suite
        run: npm run test:integration
